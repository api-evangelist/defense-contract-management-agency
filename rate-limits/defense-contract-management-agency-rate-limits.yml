description: >-
  No published rate limits. DCMA exposes no public developer API, so there is no documented
  limit, burst envelope, quota window, 429 behaviour or RateLimit-* response header contract
  to record. An honest zero.
  THIS FILE REPLACES A FABRICATED SCAFFOLD. The prior version invented free/pro tiers
  (10 and 120 requests per minute, bursts of 20 and 240) and a full X-RateLimit-* /
  Retry-After header contract against the placeholder host
  https://defense-contract-management-agency.example/api. None of it was published by DCMA,
  and it was crediting the agency with a runtime rate-limit signal it does not emit.
