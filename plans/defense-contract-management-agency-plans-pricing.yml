description: >-
  The Defense Contract Management Agency publishes NO API plans, tiers or pricing. DCMA is a
  Department of Defense combat-support agency, not a commercial API provider: its contract
  administration eTools (contract administration services directory, shared data warehouse,
  commercial item determination, audit tracking, delivery schedule manager, final contract
  closeout) have been migrating into the Procurement Integrated Enterprise Environment (PIEE),
  a DoD-operated platform reached with a government credential rather than a purchased plan.
  There is no self-service sign-up, no metered tier and no price to record.
  THIS FILE REPLACES A FABRICATED SCAFFOLD. The prior version of this artifact carried two
  invented tiers ("Free" 1,000 req/month, "Pro") priced at $0.00 against a placeholder host
  https://defense-contract-management-agency.example/api. Nothing in it was published by DCMA
  and it was scoring as if the agency had a plan surface; it has been replaced with this
  honest zero.
